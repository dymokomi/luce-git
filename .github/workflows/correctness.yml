name: Native Git object correctness
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: luce-git
      - name: Read pins
        id: pins
        shell: bash
        run: |
          echo "base=$(tr -d '\n' < luce-git/bootstrap/BASE)" >> "$GITHUB_OUTPUT"
          echo "luce=$(tr -d '\n' < luce-git/bootstrap/LUCE)" >> "$GITHUB_OUTPUT"
          echo "crypto=$(tr -d '\n' < luce-git/bootstrap/CRYPTO)" >> "$GITHUB_OUTPUT"
          echo "compress=$(tr -d '\n' < luce-git/bootstrap/COMPRESS)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: dymokomi/luce-base
          ref: ${{ steps.pins.outputs.base }}
          path: luce-base
      - name: Check out the pinned library packages
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          while read -r name revision; do
            revision=${revision%$'\r'}
            [ -n "$name" ] || continue
            git init -q "$name"
            git -C "$name" fetch -q --depth 1 "https://github.com/dymokomi/$name.git" "$revision"
            git -C "$name" checkout -q --detach FETCH_HEAD
          done < luce-git/bootstrap/PACKAGES
      - uses: actions/checkout@v4
        with:
          repository: dymokomi/luce
          ref: ${{ steps.pins.outputs.luce }}
          path: luce
      - uses: actions/checkout@v4
        with:
          repository: dymokomi/luce-crypto
          ref: ${{ steps.pins.outputs.crypto }}
          path: luce-crypto
      - uses: actions/checkout@v4
        with:
          repository: dymokomi/luce-compress
          ref: ${{ steps.pins.outputs.compress }}
          path: luce-compress
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Bootstrap without language source changes
        working-directory: luce-git
        run: python3 tools/bootstrap.py
      - name: All six compiler modes
        working-directory: luce-git
        shell: bash
        run: |
          set -o pipefail
          python3 tests/run.py 2>&1 | tee build/correctness.log
      - name: Memory safety instrumentation
        working-directory: luce-git
        shell: bash
        run: |
          set -o pipefail
          python3 tests/sanitize.py 2>&1 | tee build/sanitize.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: git-tests-${{ matrix.os }}
          path: |
            luce-git/build/correctness.log
            luce-git/build/sanitize.log
